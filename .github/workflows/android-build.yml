name: Android Build & JVM Unit Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Mock .env for Build
        run: |
          cp .env.example .env

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Run JVM Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon || gradle testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
